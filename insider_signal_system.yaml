  convergence_prompt: |
    检查讨论是否收敛。满足以下条件返回 CONVERGED：
    1. 六个核心问题都已充分辩论
    2. 各方至少回应了一次对方核心论据
    3. 已形成至少一些共识
    4. 已完成至少 min_rounds 轮

    如果仍有重要分歧未充分展开，返回 CONTINUE 并指出方向。
  summary_prompt: |
    基于以上讨论，输出内部人信号系统设计报告。必须包含：

    1. **系统架构**：买入信号 + 卖出信号的完整框架设计
    2. **数据源选择**：OpenInsider vs SEC EDGAR 直接爬取 vs 混合方案，权衡利弊
    3. **过滤规则（精确定义）**：
       a) 字段级过滤：Transaction Code、10b5-1 flag、最小金额
       b) 模式级过滤：薪酬计划识别（同日多人、金额均匀、季末等）
       c) Opportunistic vs Routine 分类：具体算法
       d) 每条规则的依据（学术引用或数据支撑）
    4. **集群信号定义**：
       a) 买入集群：窗口天数、最小人数、强度分级
       b) 卖出集群：与买入的区别、额外过滤
       c) 是否需要不同的参数？
    5. **与Phoenix策略的整合方案**：
       a) 买入集群作为确认信号怎么用
       b) 卖出集群作为排雷信号怎么用
       c) 权重建议
    6. **回测验证计划**：
       a) 历史数据回填策略
       b) 评估指标（IC、胜率、灾难率避免等）
       c) OOS验证设计
    7. **实盘部署**：
       a) 每日扫描流程
       b) 数据延迟和时效性
       c) 监控和报警
    8. **四方共识与分歧**：哪些结论达成一致，哪些仍有争议
    9. **Open Questions**：需要进一步数据验证的问题

limitation: |
  本次讨论的核心问题：如何设计一个精确、可靠的内部人交易信号系统？

  ## 背景
  我们正在为 Phoenix 量化策略（S&P 500均值回归抄底）构建一个独立的内部人交易信号模块。
  - 目标：买入集群信号（确认抄底）+ 卖出集群信号（排雷）
  - 数据源：OpenInsider.com（已搭建基础版）
  - 当前问题：需要精确区分"主动买入/卖出"vs"薪酬计划/自动交易"

  ## 已有发现（真实数据，2026年3-4月）

  ### 真实主动买入案例：NKE (Nike)
  - CEO Elliott Hill: 4/13, $200万
  - Dir Tim Cook (Apple CEO): 4/10, $106万  
  - Dir Robert Swan (前Intel CEO): 4/7, $50万
  - Dir John Rogers Jr: 4/9, $17万
  → 4人跨7天, CEO主导, 金额差异大, 非季末 = **真信号**

  ### 薪酬计划假信号：SPG (Simon Property Group)
  - 9位Director, 3/31同一天买入
  - 金额$10K-$90K, max/min=8.8x
  - 全是Director, 季末, 金额相对均匀 = **薪酬计划自动购买**

  ### 更多真实数据中的pattern
  - HTGC: 7人同日, 全Dir, max/min=2.5x, 多人接近$105K → 疑似固定额度薪酬计划
  - CHCO: 4人同日, 全Dir, max/min=1.3x, avg $14K → 几乎确定是薪酬计划
  - EFOR: 8人同日, CEO+SVP+Dir, max/min=30x, CEO $1M → 真正主动买入
  - BMI: 4人同日, CEO+VP, max/min=2.6x → 真正主动买入
  - HMH: 5人同日, CEO+CFO+CTO, max/min=50x, CFO $1M → 真正主动买入

  ## 仙股陷阱
  - HEPA ($0.04): 3人集群买入$350K，但已被纳斯达克摘牌，买入是增持控制权而非看好基本面
  - 仙股insider buying的预测力被防退市、操纵等噪音完全掩盖

  ## 学术参考
  - Cohen, Malloy, Pomorski (2012): "Decoding Inside Information" — opportunistic vs routine 分类
  - Lakonishok & Lee (2001): insider buying年化超额3-8%
  - 2024 JFE研究: 3+人集群买入6个月超额约8.7%
  - McLean & Pontiff (2016): 已发表异象约衰减1/3

  ## 关键辩论问题（必须充分讨论）

  1. **数据源**: OpenInsider爬取够用吗？还是必须从SEC EDGAR解析Form 4 XML以获取10b5-1 flag、Transaction Code等关键字段？
  2. **薪酬计划过滤**: 用模式识别（同日、全Dir、金额均匀）够精确吗？还是必须从Form 4 footnotes解析计划名称？误杀率和漏报率各预估多少？
  3. **Opportunistic vs Routine分类**: Cohen(2012)的方法需要每个内部人3年历史交易记录。对我们来说成本和价值的权衡？简化版够用吗？
  4. **卖出信号**: insider selling噪音比buying大得多（80%+是自动/财务需要）。集群卖出的信号价值足够做排雷吗？还是不值得做？
  5. **与Phoenix的整合**: insider集群买入+暴跌30%组合信号，理论上应该比单独暴跌更强。但我们没有这个组合信号的历史回测数据。怎么验证？
  6. **信号拥挤风险**: OpenInsider是免费公开的，所有人都能看到。这个信号的alpha是否已经被套利掉了？


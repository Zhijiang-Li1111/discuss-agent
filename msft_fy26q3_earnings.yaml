limitation: |
  ## 核心问题
  微软 FY2026 Q3 财报（2026年4月29日盘后发布）全线 beat，但盘后走势诡异：
  先冲 +5%（$446），5分钟内砸到 -4.3%（$406），然后电话会期间又拉回平盘（$425）。
  过去12个月 MSFT +10.6%，Mag 7 垫底（GOOGL +118%，NVDA +96%）。
  市场到底在担忧什么？

  ## FY2026 Q3 财报数据

  ### 整体
  - 营收: $82.9B, +18% YoY（CC +15%）— beat 预期 $81.4B
  - EPS: $4.27, +23% YoY — beat 预期 $4.06
  - 营业利润: $38.4B, +20%
  - 净利润: $31.8B, +23%
  - 毛利率: 68%（YoY 下降，2022以来最低区间）
  - 经营利润率: 46%
  - 经营现金流: $46.7B, +26%
  - 自由现金流: $15.8B（CapEx $31.9B 吃掉大部分）
  - CapEx: $31.9B（同比+49%），2/3 是短周期资产（GPU/CPU）
  - 股东回报: $10.2B

  ### Microsoft Cloud
  - 收入: $54.5B, +29%（CC +25%）
  - 云毛利率: 66%（YoY 下降）
  - RPO: $627B, +99% YoY（含 OpenAI）
  - 剔除 OpenAI 后 RPO +26%

  ### 分部
  - 智能云: $34.7B, +30%（CC +28%）
    - Azure: +40%（CC +39%）
    - AI 贡献 Azure 增速 13pp
  - 生产力与商业: $35.0B, +17%（CC +13%）
    - M365 Commercial Cloud: +19%（CC +15%）
    - M365 Consumer Cloud: +33%（CC +29%）
    - LinkedIn: +12%（CC +9%）
    - Dynamics 365: +22%（CC +17%）
  - 个人计算: $13.2B, -1%（CC -3%）
    - Windows OEM: -2%
    - Xbox: -5%
    - Search ads ex-TAC: +12%

  ### AI 业务
  - AI 年化收入: $37B, +123% YoY
  - Copilot 付费席位: 2000万+, +250% YoY
  - GitHub Copilot: 14万组织, 企业订阅 3x YoY
  - Copilot 周活跃度 = Outlook 水平
  - Agent mode 已成为 Word/Excel/PPT 默认体验

  ### 商业订阅
  - Commercial bookings 剔除 OpenAI: +7%
  - Commercial bookings 含 OpenAI: -46%
  - RPO $627B 中约 25% 在未来12个月确认（+39% YoY）

  ### Q4 FY2026 指引
  - 营收: $86.7-87.8B（共识 $87.53B，略 miss）
  - Azure: 39-40% CC（共识 ~37%，beat）
  - 生产力板块: $37.0-37.3B
  - 智能云: $37.95-38.25B
  - 个人计算: $11.75-12.25B
  - 云毛利率: ~64%（继续下降）
  - 经营利润率: ~44%（Q3 46%，下降）
  - CapEx: 超 $40B
  - CY2026 CapEx: ~$1900亿（含 $250 亿涨价因素）
  - 含 ~$9 亿一次性退休计划费用
  - Q4 Windows OEM: 下降 high teens

  ### FY2027 展望
  - 收入和利润双位数增长
  - OpEx 增速 mid-to-high single digits
  - 人员继续下降
  - Azure 下半年日历年温和加速
  - 产能限制至少持续到 2026 年底

  ### OpenAI 协议更新
  - IP 对微软免费使用（royalty-free）到 2032
  - 收入分成持续到 2030
  - 消除微软给 OpenAI 的分成

  ### 盘后走势
  - 收盘价: $424.46
  - 盘后高点: $446.23 (+5.13%)
  - 盘后低点: $406.28 (-4.28%)
  - 盘后收回: ~$425 (平盘)

  ### 过去一年走势
  - 2025年7月 ATH $555（Q4 FY2025 beat 后）
  - 2026年3月低点 $356（-36% from ATH）
  - 当前 ~$424
  - Mag 7 过去12个月回报垫底：+10.6%
  - 分析师均价 $579-595，隐含 +35-40% 上行

  ### 内部人减持
  - Nadella 2025年9月抛 $75M+
  - 盖茨基金会减持 ~65% MSFT 持仓（~$88亿）

  ### 电话会关键原话
  - Nadella: "AI business surpassed $37B ARR, up 123%"
  - Nadella: "Agent mode in Excel 之前不太行，直到模型能力到位后突然就行了——你必须为这些机会准备好产能"
  - Amy Hood: "需求持续超过供给，产能限制至少持续到2026年底"
  - Amy Hood: "AI 业务利润率远好于当年云转型同期"
  - Amy Hood on OpenAI: "revenue share 持续到 2030，IP royalty-free，消除了我们给他们的分成"
  - Amy Hood: CY2026 CapEx $190B 含 $25B 涨价因素
  - Amy Hood: "Azure growth to show modest acceleration in H2 calendar year"
  - Amy Hood: RPO "over $600B of revenue that we still need to deliver"

  ## 关键矛盾点（必须辩论）

  1. **CapEx 回报数学**：AI 年化 $37B 收入 vs $1900亿/年 CapEx——投资回报期多长？能算过来吗？
  2. **毛利率趋势**：从 72%（FY2023）→ 68%（Q3）→ 64%（Q4指引）——AI 越卖越薄利是结构性的吗？
  3. **RPO 含金量**：$627B +99%，但 45% 是 OpenAI——剔除后只有 +26%，这算超级增长吗？
  4. **Azure AI 贡献下降**：Q2 贡献 16pp → Q3 贡献 13pp——AI 增速在放缓？
  5. **为什么 Mag 7 垫底**：每季度都 beat，Azure 39-40%，但过去12个月 +10.6% vs GOOGL +118%——市场在 price in 什么风险？
  6. **内部人减持**：Nadella $75M + 盖茨 $88B——他们知道什么市场不知道的？
  7. **盘后走势的信号**：先涨后跌再涨——是算法噪音还是真实分歧？
  8. **seat + consumption 模式转型**：Amy Hood 说将来不只卖 seat 还卖 usage——这对利润率意味着什么？


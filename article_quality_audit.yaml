limitation: |
  ## 待审查文章（最新版）

  # 微软财报：全线Beat，市场不买账

  ## 盘后发生了什么

  美东4点财报出来涨5%到$446。5分钟砸到$406，跌4%。电话会之后爬回$425，平盘。

  **涨**：营收$82.9B超预期约$1.5B，EPS $4.27超预期约$0.21，Azure 40%（固定汇率39%）远超预期37%。

  **砸**：资本开支单季$30.9B（含融资租赁约$31.9B）。Microsoft Cloud毛利率降至66%，Q4指引约64%。Q4营收指引略低于共识。

  **回来**：电话会上Azure Q4指引39-40%（超预期），管理层说需求超过供给，AI利润率好于预期，OpenAI新协议取消分成。

  ## 两个核心关注点

  **Azure增速：超预期，在加速。** 本季39%（固定汇率），Q4指引39-40%，高于街上预期37%。没问题。

  **Copilot：增长快，变现不透明。** 付费席位2000万+，同比+250%。但没披露ARPU和营收贡献。M365商业席位4亿+，渗透率约5%。市场没法给一个看不见收入数字的产品定价。

  ## 三家放一起看

  昨晚Google和Amazon也发了财报。三家都在大举投资AI基础设施。

  ### 先说口径

  三家的"云"定义不一样，直接比数字会误导：

  - **微软Intelligent Cloud**（Azure + Server Products + GitHub）：segment经营利润率 **~40%**
  - **AWS**（纯云服务）：segment经营利润率 **37.8%**
  - **Google Cloud**（GCP + Workspace）：segment经营利润率 **~33%**

  表面看微软最高。但微软IC里有Server Products（传统软件授权）在拉高均值。Azure本身的利润率是多少？微软不披露，但可以做一个粗略推算。

  ### Azure到底赚多少？一个简单的反推

  IC segment年化营收约$139B，经营利润率约40%，经营利润约$56B。

  其中Server Products + Enterprise Services（"Legacy"业务）年化约$30B。这部分的利润率取决于假设——传统软件授权利润率很高，但Enterprise Services（咨询、部署）利润率低。

  做一个敏感性分析：

  | Legacy经营利润率假设 | 隐含Azure经营利润率 |
  |---|---|
  | 65%（偏高假设） | ~32% |
  | 55%（居中假设） | ~35% |
  | 50%（偏低假设） | ~37% |

  **结论：Azure真实经营利润率大概在32-37%之间。** 跟AWS的37.8%差距不大。IC整体的40%被高利润传统业务拉高了。

  三家纯云/AI业务的利润率可能比表面数字互相接近得多。

  ### 但方向确实不一样

  过去5个季度：
  - **Google Cloud**：从17.8%飙升到30%+
  - **AWS**：33-39%区间，整体向上
  - **微软IC**：从~44%降到~40%

  Microsoft Cloud毛利率（跨板块指标）：从约72%降到66%，Q4指引64%。管理层归因于AI基础设施投资。

  **市场定价方向，不定价绝对值。**

  ### 为什么方向不同？

  市场流行的解释是自研芯片。但这个因素被过度放大了。

  一个传导链：假设自研芯片比NVIDIA有50%的TCO优势。芯片成本占云服务总成本的40-50%。50%芯片优势转化为总成本节省约20%。AI收入只占segment收入的一部分，最终传导到segment利润率可能只有3-5个百分点。而segment成分差异可以解释8-10个百分点。

  AWS的AI训练大量依赖NVIDIA，但利润率仍然最稳。Google Cloud从亏损起步每一点规模效应都是正方向。微软是从高利润SaaS向低利润AI算力mix shift。

  ### 估值

  Google PEG约1倍，Amazon约1.3倍，微软3-4倍。投行排序：AMZN#1 > GOOGL#2 > MSFT#3。Goldman从$500砍到$450，Wedbush从$550砍到$475。但Morgan Stanley维持$650、Jefferies维持$675。

  ## Bookings和RPO怎么看？

  剔除OpenAI后bookings只有+7%。但RPO达到$627B，同比+99%。剔除OpenAI后RPO增速约+26%。两个数字矛盾可能指向合同期限拉长。

  ## 结论

  $424对应约27倍forward PE。Goldman $450只有6%上行。MS $650需要三个拐点（Copilot放量+资本开支见顶+Cloud毛利率回升）同时发生。

  **下一个催化剂：Q4 Cloud毛利率。** 超指引=积极，符合指引=中性，低于指引=确认恶化。

  好公司，错位置，缺催化。等数据。

  ## 已知的审核历史
  - Azure反推表：Legacy $30B来源需标注；Legacy margin假设敏感（每变5pp→Azure变2pp）
  - 芯片传导链：中间比例假设（40-50%占COGS）无官方来源
  - RPO已修正为$627B/+99%，剔除OpenAI后+26%（电话会披露）
  - IC年化$139B = $34.7B×4，已验证
  - Google/Amazon数字来自Copilot搜索，未直接核实官方页面


host:
  convergence_prompt: |
    检查讨论是否收敛。满足以下条件返回 CONVERGED：
    1. 四个核心问题都已充分辩论（估值区间、insider信号解读、关税影响、竞品威胁）
    2. 各方至少回应了一次对方核心论据
    3. 已完成至少 min_rounds 轮

    如果仍有重要分歧未充分展开，返回 CONTINUE 并指出方向。
  summary_prompt: |
    基于以上讨论，输出Nike(NKE)股价分析报告。必须包含：
    1. **当前估值判断**：合理/高估/低估，给出具体估值区间
    2. **Insider Buying信号解读**：CEO + Apple CEO集体在$42买入意味着什么？历史胜率如何？
    3. **关键价位**：支撑位和阻力位（至少各2个），说明依据
    4. **催化剂与时间线**：未来3-12个月的关键事件和可能影响
    5. **风险清单**：按概率×影响排序的前5大风险
    6. **操作建议**：具体的买入/持有/卖出区间和仓位建议
    7. **四方共识与分歧**：哪些结论大家同意，哪些仍有争议
  api_key: null
  base_url: null
  model: null
  max_tokens: null
  temperature: null

limitation: |
  本次讨论的核心问题：Nike(NKE)当前股价是否被严重低估？Insider集体买入信号是否可信？未来6-12个月的目标价和关键价位是什么？

  基础数据（截至2026年4月）：
  - 当前价: ~$45（52周低点附近）
  - 52周高点: $80.17 | 52周低点: $42.09
  - 距52周高点: -43.7% | 距历史高点$177: -75%
  - P/E (TTM): 29.7x | Forward P/E: 24.1x
  - P/S: 1.44x | P/B: 4.74x | EV/EBITDA: 19.2x
  - PEG: 7.12
  - 股息率: 3.6% | 派息比率: 72.5%
  - Beta: 1.15
  - RSI(14): 37.7
  - SMA20: -0.4% | SMA50: -14.8% | SMA200: -30.1%
  - 市值: $669亿
  - 营收: $463亿（FY2025, -10% YoY）
  - 毛利率: 40.6% | 营业利润率: 6.2%（历史正常12-15%）
  - FCF: $33亿（FY2025, -51% YoY）
  - 分析师目标价: 均值$54-58 | 最高$80(伯恩斯坦) | 最低$48(HSBC)

  ## Insider交易（关键信号）
  
  📌 2026年4月 Cluster Buying（$42价位）：
  - CEO Elliott Hill: 23,660股, $100万
  - Apple CEO Tim Cook（Nike董事）: 25,000股, $106万
  - 董事 Robert Swan: 11,781股, $50万
  - 董事 John Rogers Jr.: 4,000股, $17万
  
  📌 2025年12月 Cluster Buying（$58-61价位）：
  - CEO Elliott Hill: 16,388股, $100万
  - Tim Cook: 50,000股, $295万
  - Robert Swan: 8,691股, $50万
  
  12个月内高管累计买入: ~$819万
  卖出均为10b5-1预安排计划，非主动减持

  ## 近期利好
  - F3Q26 EPS $0.35 超预期（共识$0.29）
  - 北美批发+11%，渠道修复初见成效
  - 库存-1% YoY，去化良好
  - 裁员节省目标$20亿
  - 新CIO Phil McCartney接任，加速创新
  - 产品线回归"Sport First"策略

  ## 近期利空
  - 营业利润率从12.3%跌至5.6%（F3Q26）
  - 大中华区-10%，欧洲-7%
  - 关税：越南50%产能+中国18%产能，年化额外成本~$10亿
  - 竞品蚕食：New Balance +19%, On/HOKA高速增长
  - 4月1日高盛/美银/摩根同日降级
  - S&P信用降至A+
  - Nike Direct数字渠道-9%

  ## 关键矛盾点（必须辩论）
  1. CEO+Apple CEO在$42集体买入——这是"困境反转"的可靠先行指标，还是管理层自救？历史上类似信号的胜率？
  2. 营业利润率6% vs 历史12-15%——均值回归的时间线和概率？利润率修复失败的情景？
  3. 关税年化$10亿额外成本——能通过提价/转移产能消化吗？对利润率的持续影响？
  4. 品牌护城河是否在实质性削弱？On/HOKA/NB的蚕食是周期性的还是结构性的？
  5. $45的估值（P/E 30x, 但利润在谷底）如果用正常化利润看，真实估值是多少？


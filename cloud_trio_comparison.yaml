limitation: |
  ## 核心问题
  三巨头（微软/Google/Amazon）同时发布财报，都在大举投资AI基础设施（$180-200B/年），
  但过去12个月股价表现天差地别：GOOGL +118%、AMZN +38-47%、MSFT +10.6%。
  为什么？市场在 price in 什么？

  ## 微软 FY2026 Q3（2026年4月29日发布）

  ### 核心数据
  - 营收: $82.9B, +18% YoY — beat $81.4B
  - EPS: $4.27, +23% — beat $4.06
  - Azure: +40% (CC +39%)
  - AI年化: $37B, +123%
  - 云收入: $54.5B, +29%
  - 云毛利率: 66%, YoY下降
  - 公司毛利率: 68%, 2022以来最低
  - Q4云毛利率指引: ~64%
  - CapEx: $31.9B (+49% YoY)
  - CY2026 CapEx指引: ~$190B（含$25B涨价）
  - FCF: $15.8B
  - RPO: $627B, +99%（含OpenAI ~45%；剔除OpenAI +26%）
  - Bookings 剔除OpenAI: +7%
  - Copilot: 2000万付费席位, +250% YoY
  - 盘后: 先+5%($446) → 砸到-4%($406) → 回$425平盘
  - 过去12个月: +10.6%, Mag 7垫底
  - PEG: 3-4x

  ## Google (Alphabet) Q1 2026（2026年4月29日发布）

  ### 核心数据
  - 营收: $109.9B, +22% YoY — beat $107.2B
  - EPS: $5.11（含$2.35一次性投资收益；调整后~$2.76）— beat
  - 经营利润: $39.7B, 经营利润率 36.1%（↑YoY）
  - Google Cloud: $20.0B, **+63% YoY**
  - Cloud经营利润率: **32.9%**（去年17.8%，5年前-47%）
  - Cloud经营利润: $6.6B
  - Cloud backlog: $462B+
  - 搜索广告: $60.4B, +19%
  - YouTube: $9.9B, +11%
  - AI Overviews CTR提升: +12%
  - Workspace Gemini seats: 14M+
  - 付费订阅总计: 3.5亿
  - CapEx: $35.7B
  - FY2026 CapEx指引: $180-190B（上调）
  - FCF: $10.1B
  - 盘后: +6-7%
  - 过去12个月: **+118%**
  - PEG: ~1.0x
  - 自研芯片: TPU（大规模部署，成本优势显著）

  ### Cloud利润率历程
  - 2020: -47%
  - 2023: +5%
  - Q4 2025: 30%
  - Q1 2026: **33%**

  ## Amazon Q1 2026（2026年4月29日发布）

  ### 核心数据
  - 营收: $181.5B, +17% YoY — beat $177.3B
  - EPS: $2.78（含$168亿Anthropic投资收益；需调整）— beat $1.63-1.65
  - 经营利润率: **13.1%**（历史新高）
  - AWS: $37.6B, **+28% YoY**（15个季度最快增速）
  - AWS经营利润: $14.2B
  - AWS经营利润率: **37.7%**（去年33%）
  - AWS年化: $1500亿
  - AI年化收入: $15B+（AWS中约10%）
  - 自研芯片: Trainium/Inferentia/Graviton年化$20B+, 环比+40%
  - Bedrock: 12.5万客户, 支出环比+170%
  - 广告: $172.4B, +24%
  - CapEx: $44.2B
  - 全年CapEx指引: ~$200B
  - FCF: $1.2B（去年$25.9B，CapEx吃掉）
  - 盘后: +2.7%（波动，一度-2%再反弹）
  - 过去12个月: +38-47%
  - PEG: ~1.3x
  - 自研芯片: Trainium2售罄，Trainium3出货中，比同级GPU性价比高30%+

  ### AWS利润率历程
  - Q2 2025: 33%
  - Q4 2025: 35%
  - Q1 2026: **37.7%**（持续扩张）

  ## 关键矛盾点（必须辩论）

  1. **利润率方向分化**：Google Cloud 从-47%→33%，AWS从33%→38%，微软云从72%→64%——为什么方向完全相反？是结构性的还是周期位置不同？
  2. **自研芯片差距**：Google TPU、Amazon Trainium 都在降成本，微软主要靠NVIDIA和刚起步的Maya/Cobalt——这是利润率差异的根本原因吗？
  3. **AI变现层级**：Google靠广告优化（CPM提升，立竿见影），Amazon靠平台+芯片，微软靠算力批发+Copilot SaaS——谁的商业模式最优？
  4. **CapEx效率**：三家都花$180-200B，但Google的钱转化为利润率扩张，微软的钱转化为利润率收缩——投资效率的差异在哪？
  5. **估值合理性**：MSFT PEG 3-4x、GOOGL PEG 1.0x、AMZN PEG 1.3x——微软贵了多少？应该交易在多少PEG？
  6. **Cloud增速**：Google Cloud +63%远超Azure +40%和AWS +28%——这是基数效应还是真正在抢份额？
  7. **EPS质量**：三家都有一次性项目（Google $2.35投资收益、Amazon $168亿Anthropic、微软OpenAI损失从$583M→$14M）——调整后谁的EPS最干净？
  8. **Bookings健康度**：微软剔除OpenAI仅+7%，Google Cloud backlog $462B，AWS backlog未披露——谁的增量需求最强？


host:
  convergence_prompt: |
    检查讨论是否收敛。满足以下条件返回 CONVERGED：
    1. 四个核心维度都已辩论（利润质量、偿债能力、增长引擎、竞争地位）
    2. 各方至少回应了一次对方核心论据
    3. 已完成至少 min_rounds 轮

    如果仍有重要分歧未充分展开，返回 CONTINUE 并指出方向。
  summary_prompt: |
    基于以上讨论，输出Nike(NKE)财务深度分析报告。必须包含：
    1. **财务健康度评分**：给Nike的财务健康打分（1-10），分维度评分
    2. **利润质量判定**：当前利润是否可信？现金流和利润的匹配度？
    3. **偿债与股息可持续性**：还能撑多久？什么条件下会出问题？
    4. **增长引擎诊断**：哪些引擎熄火了？哪些可能重启？时间线？
    5. **竞争地位变化**：Nike在行业中的相对位置如何变化？趋势是否可逆？
    6. **关键财务指标恶化预警**：哪些比率在发出危险信号？
    7. **四方共识与分歧**
  api_key: null
  base_url: null
  model: null
  max_tokens: null
  temperature: null

limitation: |
  本次讨论的核心问题：Nike(NKE)的财务状况到底有多差？是周期性谷底还是结构性恶化？

  ## 完整财务数据

  ### 营收趋势
  | FY | 总营收 | YoY |
  |----|--------|-----|
  | 2021 | $44.5B | — |
  | 2022 | $46.7B | +5% |
  | 2023 | $51.4B | +10% |
  | 2024 | $46.3B | -10% |
  | 2025 | $46.3B | 0%（全年确认） |

  ### 品牌拆分
  Nike Brand: $42.3B→$44.5B→$49.3B→$44.6B→$45.2B
  Converse: $2.2B→$2.35B→$2.08B→$1.69B→$1.29B（-45%从高点）

  ### 渠道拆分
  Nike Direct(DTC): $16.4B(37%)→$18.7B(41%)→$20.0B(39%)→~$18B(39%)→$18.8B(42%)
  FY2025 Nike Direct -13% YoY, 批发-7% YoY

  ### 利润率趋势
  | FY | 毛利率 | 营业利润率 | SG&A |
  |----|--------|-----------|------|
  | 2021 | 45.0% | 15.5% | $13.0B |
  | 2022 | 46.0% | 12.5% | $14.8B |
  | 2023 | 44.3% | 12.3% | $16.4B |
  | 2024 | 44.6% | 7.2% | $16.6B |
  | 2025 | 42.7% | 6.1% | $16.1B |

  ### SG&A拆分
  营销(Demand Creation): $3.1B→$3.9B→$4.1B→$4.3B→$4.7B（+51%，但营收横盘）
  管理运营(Operating Overhead): $9.9B→$11.0B→$12.3B→$12.3B→$11.4B（FY2025开始下降）

  ### 现金流
  | FY | 经营性CF | Capex | FCF |
  |----|---------|-------|-----|
  | 2021 | ~$5.0B | ~$0.7B | ~$4.3B |
  | 2022 | ~$5.2B | ~$0.8B | ~$4.4B |
  | 2023 | ~$5.8B | ~$0.9B | ~$4.9B |
  | 2024 | ~$7.4B | ~$0.8B | ~$6.6B |
  | 2025 | ~$4.1B | ~$0.9B | ~$3.3B |
  
  FY2024 FCF虚高（库存大甩卖）。FY2025才是正常化水平。

  ### 回购与股息
  回购: $0.6B→$4.0B→$5.5B→$4.3B→$3.0B
  流通股: 1,609M→1,611M→1,570M→1,530M→1,488M
  FY2025总回报$5.3B（回购$3.0B+股息$2.4B）> FCF $3.3B！

  ### 资产负债表
  - 库存$7.5B（持平）
  - 净债务/EBITDA ~1.5x
  - 信用评级 A+（从AA-降级）
  - 流动比率 2.14, Debt/Equity 0.79
  - 现金/股$5.44, 账面价值/股$9.52

  ### 关键比率（恶化趋势）
  | FY | ROE | ROA | ROIC |
  |----|-----|-----|------|
  | 2021 | 43.1% | 15.6% | 36.7-44.9% |
  | 2022 | 34.6% | 12.4% | 26.9-31.8% |
  | 2023 | 40.1% | 14.2% | 29.6-37.9% |
  | 2024 | 23.3% | 8.2% | 17.1-20.5% |
  | 2025 | 16-18% | 5.8-8.8% | 11-15% |

  ### 同行参考
  - Adidas: 营收~€22B，毛利率~50%
  - On Running: 营收~$2B+，高速增长
  - HOKA(Deckers): 营收~$2-2.6B，高速增长
  - New Balance: 营收$9.2B，+19% YoY

  ## 关键矛盾点（必须辩论）
  1. 营销费用+51%但营收横盘——$4.7B的营销钱花对了吗？营销ROI是否在崩塌？
  2. FY2025总股东回报$5.3B > FCF $3.3B——这在"吃老本"，能持续多久？
  3. ROIC从45%暴跌到11-15%——这是周期性的还是资本效率在结构性恶化？
  4. Converse从$2.35B跌到$1.29B——该剥离吗？对Nike品牌有什么影响？
  5. SG&A占收入比从29%升到35%——费用控制失灵还是转型必要投入？
  6. 毛利率从46%跌到42.7%——是关税/促销导致的暂时现象还是新常态？


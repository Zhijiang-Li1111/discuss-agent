  convergence_prompt: |
    检查讨论是否收敛。满足以下条件返回 CONVERGED：
    1. 猪周期当前位置已有共识或明确分歧
    2. 牧原的竞争力和财务安全性已被审计
    3. 至少3个侧面指标被用于交叉验证
    4. 各方至少回应了一次对方核心论据
    5. 已完成至少 min_rounds 轮
  max_tokens: null
  model: null
  summary_prompt: |
    基于讨论，输出猪周期深度分析报告。

    必须包含：
    1. **猪周期当前位置判断**：是底部、接近底部、还是底部已过？用数据说话
    2. **能繁母猪去化进度**：去化了多少？还需要去化多少才能触发价格反弹？
    3. **大厂vs散户**：牧原/温氏等大厂有没有减产？散户退出了多少？行业集中度变化
    4. **牧原股份深度分析**：成本优势、财务安全性、产能策略、估值
    5. **侧面验证**：饲料、兽药、仔猪、冻品等指标的交叉验证结果
    6. **历史对比**：当前周期vs历史周期底部的相似度
    7. **关键风险**
    8. **四方共识与分歧**
    9. **投资建议**：现在是不是配置猪周期股的时机？
  temperature: null
limitation: |
  ## 核心问题

  1. 当前是不是猪周期的底部？
  2. 牧原股份在这个位置值不值得关注？
  3. 大厂有没有减产？小散户退出了多少？
  4. 侧面证据（饲料、兽药等）能不能验证周期位置？

  ## 背景知识

  猪周期典型传导链：
  猪价下跌→养殖亏损→淘汰母猪→能繁存栏下降→12-14个月后出栏减少→供给收缩→猪价上涨→补栏→能繁存栏上升→出栏增加→供给过剩→猪价下跌

  关键数据点（需要用工具搜索最新值）：
  - 能繁母猪存栏量（农业农村部月报）
  - 生猪出栏量
  - 猪粮比（盈亏平衡线通常在6:1左右）
  - 牧原股份头均完全成本
  - 行业平均完全成本
  - 当前生猪价格
  - 仔猪价格
  - 猪饲料产量
  - 冻品库存

  核心企业：
  - 牧原股份（002714）：一体化自繁自养，行业成本最低
  - 温氏股份（300498）：公司+农户模式
  - 新希望（000876）：饲料+养殖一体化
  - 正邦科技（002157）：已重整
  - 天邦食品（002124）：已重整

  ## 关键矛盾点（必须辩论）

  1. **"周期底部"的判断标准是什么？** 能繁母猪存栏连续下降X个月？猪价跌破成本线？亏损持续X个月？
  2. **大厂化是否改变了猪周期的形态？** 牧原成本低可以一直扛，散户扛不住退出——但如果大厂不减产，供给不收缩，价格怎么反弹？
  3. **牧原的"成本优势"有多大？** 头均14.X元/公斤 vs 行业16-17元？这个差距在猪价低迷时是护城河还是"慢性失血"？
  4. **侧面指标有没有互相矛盾的？** 比如饲料产量下降但屠宰量没降——说明什么？

